[package]
name = "agentmux"
version = "0.1.0"
edition = "2024"
description = "Persistent, observable, steerable terminal sessions for AI agents"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
portable-pty = "0.9"
rmcp = { version = "2.2", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23"

